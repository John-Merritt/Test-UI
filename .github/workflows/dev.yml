name: Deploy to K3s

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: self-hosted
    env:
      IMAGE_NAME: kuhzoo-ui
      IMAGE_TAG: latest
      REGISTRY: localhost

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG .

      - name: Save Docker image to tar
        run:
          sudo ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images rm $REGISTRY/$IMAGE_NAME:$IMAGE_TAG || true 
          docker save $REGISTRY/$IMAGE_NAME:$IMAGE_TAG-o image.tar

      - name: Load Docker image into k3s
        run: |
          sudo ctr -a /run/k3s/containerd/containerd.sock --namespace k8s.io images import image.tar

      - name: Apply k8s manifests
        run: |
          export KUBECONFIG=/home/github-runner2/.kube/config
          kubectl apply -f k8s/dev/deployment.yaml
          kubectl apply -f k8s/dev/service.yaml
          kubectl apply -f k8s/dev/ingress.yaml
          kubectl rollout restart deployment kuhzoo-ui -n default



